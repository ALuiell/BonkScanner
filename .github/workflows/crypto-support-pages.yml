name: Deploy crypto support page

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/crypto-support-pages.yml"
      - "site/crypto-support/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload static site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/crypto-support

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
