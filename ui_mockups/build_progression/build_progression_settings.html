:root[data-theme=&quot;light&quot;] {

* {

}

html &gt; body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */

    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );

    --foreground,

  background: transparent !important;

  font-weight: var(--font-weight-normal);

  text-decoration: none;

a:is(:hover, :focus-visible) {

h2,
h3,
h4,
h5,
h6,

}

h3,
h4,
h5,

  font-weight: var(--font-weight-medium);
  line-height: 1.3;
}

b,
strong,
th {

}

code:not(pre code) {

  padding: 1px 6px;

}

  font: inherit;
  text-align: start;
}

.table :is(th, td) {

}

.table-responsive &gt; .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {

}

.table thead th {

}

}

}

}

.table .text-nowrap {

}

  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {

  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: superellipse(1.5);
  color: var(--card-foreground);
  background: var(--card);
}

  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(

    calc(100vh - 10px)

  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

  align-items: center;
  gap: 10px;
}

  padding: 3px 8px;

  color: var(--accent-foreground);
  background: var(--accent);
  font-weight: var(--font-weight-medium);

.text-muted {

}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;

  background: var(--primary-foreground);

  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: 16px !important;
  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;bonk-progression-editor&#x27;);
      const schedule = document.getElementById(&#x27;bonk-schedule-enabled&#x27;);
      const warningField = root.querySelector(&#x27;.bonk-warning-field&#x27;);
      const deadlineType = document.getElementById(&#x27;bonk-deadline-type&#x27;);
      const stageField = document.getElementById(&#x27;bonk-stage-field&#x27;);
      const timeField = document.getElementById(&#x27;bonk-time-field&#x27;);
      const stageValue = document.getElementById(&#x27;bonk-stage-value&#x27;);
      const timeValue = document.getElementById(&#x27;bonk-time-value&#x27;);
      const timeLabel = document.getElementById(&#x27;bonk-time-label&#x27;);
      const selectedChip = document.getElementById(&#x27;bonk-selected-chip&#x27;);
      const targetLabel = document.getElementById(&#x27;bonk-target-label&#x27;);
      const targetValue = document.getElementById(&#x27;bonk-target-value&#x27;);
      const summary = document.getElementById(&#x27;bonk-rule-summary&#x27;);
      const preview = document.getElementById(&#x27;bonk-preview-message&#x27;);
      const search = document.getElementById(&#x27;bonk-search-input&#x27;);
      const groups = document.getElementById(&#x27;bonk-pick-groups&#x27;);
      const noResults = document.getElementById(&#x27;bonk-no-results&#x27;);
      const list = document.getElementById(&#x27;bonk-rule-list&#x27;);
      const ruleCount = document.getElementById(&#x27;bonk-rule-count&#x27;);
      let kind = &#x27;item&#x27;;

      const statNames = [&#x27;Damage to Elites&#x27;, &#x27;Duration&#x27;, &#x27;Elite Spawn Increase&#x27;, &#x27;Crit Chance&#x27;, &#x27;Attack Speed&#x27;, &#x27;Crit Damage&#x27;, &#x27;Luck&#x27;, &#x27;XP Gain&#x27;, &#x27;Movement Speed&#x27;, &#x27;Max HP&#x27;];
      const itemGroupsMarkup = groups.innerHTML;

      function selectedName() {
        return selectedChip.textContent.trim();
      }

      function unitText() {
        if (kind === &#x27;stat&#x27;) return &#x27;minimum&#x27;;
        return Number(targetValue.value) === 1 ? &#x27;copy&#x27; : &#x27;copies&#x27;;
      }

      function updateDeadlineFields() {
        const type = deadlineType.value;
        stageField.hidden = type !== &#x27;before-stage&#x27; &amp;&amp; type !== &#x27;stage-overtime&#x27;;
        timeField.hidden = type !== &#x27;run&#x27; &amp;&amp; type !== &#x27;stage-overtime&#x27;;
        timeLabel.textContent = type === &#x27;run&#x27; ? &#x27;Run time&#x27; : &#x27;Overtime minute&#x27;;
        updateSummary();
      }

      function deadlineText() {
        if (!schedule.checked || deadlineType.value === &#x27;none&#x27;) return &#x27;&#x27;;
        if (deadlineType.value === &#x27;run&#x27;) return `Run · ${timeValue.value || &#x27;00:00&#x27;}`;
        if (deadlineType.value === &#x27;before-stage&#x27;) return `Before ${stageValue.value}`;
        return `${stageValue.value} OT · ${timeValue.value || &#x27;00:00&#x27;}`;
      }

      function updateSummary() {
        const goal = `${targetValue.value || &#x27;1&#x27;} ${unitText()}`;
        let ending = &#x27;.&#x27;;
        if (schedule.checked) {
          if (deadlineType.value === &#x27;run&#x27;) ending = ` by ${timeValue.value || &#x27;00:00&#x27;} run time.`;
          if (deadlineType.value === &#x27;before-stage&#x27;) ending = ` before ${stageValue.value} begins.`;
          if (deadlineType.value === &#x27;stage-overtime&#x27;) ending = ` by overtime ${timeValue.value || &#x27;00:00&#x27;} on ${stageValue.value}.`;
        }
        summary.textContent = `Complete ${goal} of ${selectedName()}${ending}`;
      }

      function updatePreview() {
        preview.textContent = schedule.checked
          ? &quot;Community T2 build · 4/14 | NEXT: Ice Cube 0/1 by T2 OT 03:00 | Joe&#x27;s Dagger 0/1 High · +11 more&quot;
          : &quot;Community T2 build · Missing: Joe&#x27;s Dagger 0/1, Ice Cube 0/1, Lightning Orb 1/3 · +7 items, +4 stats&quot;;
      }

      function updateSchedule() {
        root.classList.toggle(&#x27;is-schedule-off&#x27;, !schedule.checked);
        warningField.hidden = !schedule.checked;
        deadlineType.disabled = !schedule.checked;
        if (!schedule.checked) {
          stageField.hidden = true;
          timeField.hidden = true;
        } else {
          updateDeadlineFields();
        }
        updateSummary();
        updatePreview();
      }

      function bindPicks() {
        root.querySelectorAll(&#x27;.bonk-pick&#x27;).forEach((button) =&gt; {
          button.addEventListener(&#x27;click&#x27;, () =&gt; {
            root.querySelectorAll(&#x27;.bonk-pick&#x27;).forEach((peer) =&gt; peer.classList.remove(&#x27;is-selected&#x27;));
            button.classList.add(&#x27;is-selected&#x27;);
            selectedChip.textContent = button.dataset.name;
            updateSummary();
          });
        });
      }

      function showKind(nextKind) {
        kind = nextKind;
        root.querySelectorAll(&#x27;[data-kind]&#x27;).forEach((button) =&gt; {
          button.setAttribute(&#x27;aria-pressed&#x27;, String(button.dataset.kind === kind));
        });
        search.value = &#x27;&#x27;;
        search.placeholder = kind === &#x27;item&#x27; ? &#x27;Search items…&#x27; : &#x27;Search stats…&#x27;;
        targetLabel.textContent = kind === &#x27;item&#x27; ? &#x27;Required copies&#x27; : &#x27;Minimum value&#x27;;
        targetValue.value = kind === &#x27;item&#x27; ? &#x27;1&#x27; : &#x27;3.4&#x27;;
        targetValue.step = kind === &#x27;item&#x27; ? &#x27;1&#x27; : &#x27;0.1&#x27;;
        if (kind === &#x27;item&#x27;) {
          groups.innerHTML = itemGroupsMarkup;
          selectedChip.textContent = &quot;Joe&#x27;s Dagger&quot;;
        } else {
          groups.innerHTML = `&lt;div class=&quot;bonk-pick-group&quot; data-group=&quot;Player stats&quot;&gt;&lt;div class=&quot;bonk-group-label&quot;&gt;&lt;span&gt;Player stats&lt;/span&gt;&lt;small&gt;${statNames.length}&lt;/small&gt;&lt;/div&gt;&lt;div class=&quot;bonk-chip-flow&quot;&gt;${statNames.map((name, index) =&gt; `&lt;button type=&quot;button&quot; class=&quot;bonk-pick bonk-stat${index === 0 ? &#x27; is-selected&#x27; : &#x27;&#x27;}&quot; data-name=&quot;${name}&quot;&gt;${name}&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;&lt;/div&gt;`;
          selectedChip.textContent = &#x27;Damage to Elites&#x27;;
        }
        bindPicks();
        updateSummary();
      }

      function filterPicks() {
        const query = search.value.trim().toLowerCase();
        let visible = 0;
        groups.querySelectorAll(&#x27;.bonk-pick&#x27;).forEach((button) =&gt; {
          const show = !query || button.dataset.name.toLowerCase().includes(query);
          button.hidden = !show;
          if (show) visible += 1;
        });
        groups.querySelectorAll(&#x27;.bonk-pick-group&#x27;).forEach((group) =&gt; {
          group.hidden = !Array.from(group.querySelectorAll(&#x27;.bonk-pick&#x27;)).some((button) =&gt; !button.hidden);
        });
        noResults.hidden = visible !== 0;
      }

      function refreshRuleCount() {
        const count = list.querySelectorAll(&#x27;.bonk-rule-row&#x27;).length;
        ruleCount.textContent = `${count} ${count === 1 ? &#x27;requirement&#x27; : &#x27;requirements&#x27;}`;
      }

      list.addEventListener(&#x27;click&#x27;, (event) =&gt; {
        const button = event.target.closest(&#x27;button&#x27;);
        const row = event.target.closest(&#x27;.bonk-rule-row&#x27;);
        if (!button || !row) return;
        if (button.hasAttribute(&#x27;data-remove&#x27;)) row.remove();
        if (button.dataset.move === &#x27;up&#x27; &amp;&amp; row.previousElementSibling) list.insertBefore(row, row.previousElementSibling);
        if (button.dataset.move === &#x27;down&#x27; &amp;&amp; row.nextElementSibling) list.insertBefore(row.nextElementSibling, row);
        refreshRuleCount();
      });

      document.getElementById(&#x27;bonk-add-rule&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
        const row = document.createElement(&#x27;div&#x27;);
        const deadline = deadlineText();
        row.className = &#x27;bonk-rule-row&#x27;;
        row.innerHTML = `&lt;span class=&quot;bonk-grip&quot; aria-hidden=&quot;true&quot;&gt;⠿&lt;/span&gt;&lt;span class=&quot;bonk-row-name&quot;&gt;${kind === &#x27;stat&#x27; ? &#x27;&lt;i class=&quot;bonk-stat-mark&quot;&gt;STAT&lt;/i&gt;&#x27; : &#x27;&lt;i class=&quot;bonk-dot bonk-dot-rare&quot;&gt;&lt;/i&gt;&#x27;}${selectedName()}&lt;/span&gt;&lt;span class=&quot;bonk-goal&quot;&gt;${targetValue.value} ${unitText()}&lt;/span&gt;&lt;span class=&quot;bonk-deadline${deadline ? &#x27;&#x27; : &#x27; is-none&#x27;}&quot;&gt;${deadline || &#x27;No deadline&#x27;}&lt;/span&gt;&lt;div class=&quot;bonk-row-actions&quot;&gt;&lt;button type=&quot;button&quot; data-move=&quot;up&quot; aria-label=&quot;Move up&quot;&gt;↑&lt;/button&gt;&lt;button type=&quot;button&quot; data-move=&quot;down&quot; aria-label=&quot;Move down&quot;&gt;↓&lt;/button&gt;&lt;button type=&quot;button&quot; data-remove aria-label=&quot;Remove&quot;&gt;×&lt;/button&gt;&lt;/div&gt;`;
        list.appendChild(row);
        refreshRuleCount();
      });

      root.querySelectorAll(&#x27;[data-kind]&#x27;).forEach((button) =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; showKind(button.dataset.kind)));
      schedule.addEventListener(&#x27;change&#x27;, updateSchedule);
      deadlineType.addEventListener(&#x27;change&#x27;, updateDeadlineFields);
      stageValue.addEventListener(&#x27;change&#x27;, updateSummary);
      timeValue.addEventListener(&#x27;input&#x27;, updateSummary);
      targetValue.addEventListener(&#x27;input&#x27;, updateSummary);
      search.addEventListener(&#x27;input&#x27;, filterPicks);
      document.getElementById(&#x27;bonk-clear-rule&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
        deadlineType.value = &#x27;none&#x27;;
        targetValue.value = &#x27;1&#x27;;
        updateDeadlineFields();
      });

      bindPicks();
      updateDeadlineFields();
      updateSchedule();
      refreshRuleCount();
    })();
  &lt;/script&gt;
