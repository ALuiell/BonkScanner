  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: 16px !important;
  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;bonk-build-v2&#x27;);
      const itemData = [
        [&quot;Joe&#x27;s Dagger&quot;, &#x27;legendary&#x27;], [&#x27;Anvil&#x27;, &#x27;legendary&#x27;], [&#x27;Ice Cube&#x27;, &#x27;legendary&#x27;], [&#x27;Lightning Orb&#x27;, &#x27;legendary&#x27;],
        [&#x27;Dragonfire&#x27;, &#x27;legendary&#x27;], [&#x27;Spicy Meatball&#x27;, &#x27;legendary&#x27;], [&#x27;Overpowered Lamp&#x27;, &#x27;legendary&#x27;], [&#x27;Sucky Magnet&#x27;, &#x27;legendary&#x27;],
        [&quot;Grandma&#x27;s Secret Tonic&quot;, &#x27;rare&#x27;], [&#x27;Cursed Doll&#x27;, &#x27;common&#x27;]
      ];
      const statData = [[&#x27;Damage to Elites&#x27;, &#x27;stat&#x27;], [&#x27;Duration&#x27;, &#x27;stat&#x27;], [&#x27;Elite Spawn Increase&#x27;, &#x27;stat&#x27;], [&#x27;Crit Chance&#x27;, &#x27;stat&#x27;]];
      const groupLabels = { legendary: &#x27;Legendary&#x27;, rare: &#x27;Rare&#x27;, common: &#x27;Common&#x27;, stat: &#x27;Player stats&#x27; };
      let kind = &#x27;item&#x27;;
      let deadline = &#x27;overtime&#x27;;
      let selected = &quot;Joe&#x27;s Dagger&quot;;

      const picks = document.getElementById(&#x27;bonk2-picks&#x27;);
      const search = document.getElementById(&#x27;bonk2-search&#x27;);
      const selectedName = document.getElementById(&#x27;bonk2-selected-name&#x27;);
      const selectedSubtitle = document.getElementById(&#x27;bonk2-selected-subtitle&#x27;);
      const required = document.getElementById(&#x27;bonk2-required&#x27;);
      const ideal = document.getElementById(&#x27;bonk2-ideal&#x27;);
      const requiredLabel = document.getElementById(&#x27;bonk2-required-label&#x27;);
      const priority = document.getElementById(&#x27;bonk2-priority&#x27;);
      const stage = document.getElementById(&#x27;bonk2-stage&#x27;);
      const time = document.getElementById(&#x27;bonk2-time&#x27;);
      const timeLabel = document.getElementById(&#x27;bonk2-time-label&#x27;);
      const stageWrap = document.getElementById(&#x27;bonk2-stage-wrap&#x27;);
      const timeWrap = document.getElementById(&#x27;bonk2-time-wrap&#x27;);
      const deadlineFields = document.getElementById(&#x27;bonk2-deadline-fields&#x27;);
      const summary = document.getElementById(&#x27;bonk2-summary&#x27;);
      const deadlineEnabled = document.getElementById(&#x27;bonk2-deadlines-enabled&#x27;);

      function renderPicks() {
        const data = kind === &#x27;item&#x27; ? itemData : statData;
        const query = search.value.trim().toLowerCase();
        const filtered = data.filter(([name]) =&gt; name.toLowerCase().includes(query));
        const order = kind === &#x27;item&#x27; ? [&#x27;legendary&#x27;, &#x27;rare&#x27;, &#x27;common&#x27;] : [&#x27;stat&#x27;];
        picks.innerHTML = order.map(rarity =&gt; {
          const entries = filtered.filter(([, entryRarity]) =&gt; entryRarity === rarity);
          if (!entries.length) return &#x27;&#x27;;
          const buttons = entries.map(([name]) =&gt;
            `&lt;button type=&quot;button&quot; class=&quot;bonk2-pick${name === selected ? &#x27; is-selected&#x27; : &#x27;&#x27;}&quot; data-name=&quot;${name.replaceAll(&#x27;&quot;&#x27;, &#x27;&amp;quot;&#x27;)}&quot; data-rarity=&quot;${rarity}&quot;&gt;${name}&lt;/button&gt;`
          ).join(&#x27;&#x27;);
          return `&lt;section class=&quot;bonk2-pick-group&quot; data-group=&quot;${rarity}&quot;&gt;&lt;div class=&quot;bonk2-pick-group-head&quot;&gt;&lt;span&gt;${groupLabels[rarity]}&lt;/span&gt;&lt;small&gt;${entries.length}&lt;/small&gt;&lt;/div&gt;&lt;div class=&quot;bonk2-pick-grid&quot;&gt;${buttons}&lt;/div&gt;&lt;/section&gt;`;
        }).join(&#x27;&#x27;);
        picks.querySelectorAll(&#x27;.bonk2-pick&#x27;).forEach(button =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; {
          selected = button.dataset.name;
          selectedName.textContent = selected;
          selectedName.dataset.rarity = button.dataset.rarity;
          selectedSubtitle.textContent = kind === &#x27;stat&#x27; ? &#x27;Detected player stat&#x27; : `${groupLabels[button.dataset.rarity]} item`;
          renderPicks();
          updateSummary();
        }));
      }

      function updateDeadlineFields() {
        const hasStage = deadline === &#x27;stage-start&#x27; || deadline === &#x27;overtime&#x27;;
        const hasTime = deadline === &#x27;run&#x27; || deadline === &#x27;overtime&#x27;;
        stageWrap.hidden = !hasStage;
        timeWrap.hidden = !hasTime;
        deadlineFields.hidden = deadline === &#x27;none&#x27;;
        timeLabel.textContent = deadline === &#x27;run&#x27; ? &#x27;Run clock time&#x27; : &#x27;Overtime minute&#x27;;
        updateSummary();
      }

      function updateSummary() {
        const value = required.value || &#x27;1&#x27;;
        const unit = kind === &#x27;item&#x27; ? &#x27;×&#x27; : &#x27;&#x27;;
        let text = kind === &#x27;item&#x27; ? `Collect ${value}${unit} ${selected}` : `Reach ${value}× ${selected}`;
        if (deadlineEnabled.checked) {
          if (deadline === &#x27;run&#x27;) text += ` before the run clock reaches ${time.value || &#x27;00:00&#x27;}`;
          if (deadline === &#x27;stage-start&#x27;) text += ` before ${stage.value} begins`;
          if (deadline === &#x27;overtime&#x27;) text += ` before ${stage.value} overtime reaches ${time.value || &#x27;00:00&#x27;}`;
        }
        if (ideal.value) text += `. Ideal target: ${ideal.value}${kind === &#x27;item&#x27; ? &#x27;×&#x27; : &#x27;×&#x27;}`;
        text += `. Priority: ${priority.value}.`;
        summary.textContent = text;
      }

      root.querySelectorAll(&#x27;[data-kind]&#x27;).forEach(button =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; {
        kind = button.dataset.kind;
        root.querySelectorAll(&#x27;[data-kind]&#x27;).forEach(peer =&gt; peer.setAttribute(&#x27;aria-pressed&#x27;, String(peer === button)));
        selected = kind === &#x27;item&#x27; ? &quot;Joe&#x27;s Dagger&quot; : &#x27;Damage to Elites&#x27;;
        selectedName.textContent = selected;
        selectedName.dataset.rarity = kind === &#x27;item&#x27; ? &#x27;legendary&#x27; : &#x27;stat&#x27;;
        selectedSubtitle.textContent = kind === &#x27;item&#x27; ? &#x27;Legendary item&#x27; : &#x27;Detected player stat&#x27;;
        requiredLabel.textContent = kind === &#x27;item&#x27; ? &#x27;Required copies&#x27; : &#x27;Required multiplier&#x27;;
        required.value = kind === &#x27;item&#x27; ? &#x27;1&#x27; : &#x27;3.4&#x27;;
        required.step = kind === &#x27;item&#x27; ? &#x27;1&#x27; : &#x27;0.1&#x27;;
        ideal.value = &#x27;&#x27;;
        search.value = &#x27;&#x27;;
        search.placeholder = kind === &#x27;item&#x27; ? &#x27;Search items…&#x27; : &#x27;Search stats…&#x27;;
        renderPicks();
        updateSummary();
      }));

      root.querySelectorAll(&#x27;[data-deadline]&#x27;).forEach(button =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; {
        deadline = button.dataset.deadline;

      }));

      search.addEventListener(&#x27;input&#x27;, renderPicks);
      [required, ideal, time].forEach(control =&gt; control.addEventListener(&#x27;input&#x27;, updateSummary));
      [priority, stage].forEach(control =&gt; control.addEventListener(&#x27;change&#x27;, updateSummary));
      deadlineEnabled.addEventListener(&#x27;change&#x27;, () =&gt; {
        root.classList.toggle(&#x27;is-deadlines-off&#x27;, !deadlineEnabled.checked);
        updateSummary();
      });

      document.getElementById(&#x27;bonk2-add&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
        const row = document.createElement(&#x27;div&#x27;);
        row.className = &#x27;bonk2-rule&#x27;;
        const deadlineLabel = deadline === &#x27;none&#x27; || !deadlineEnabled.checked ? &#x27;No deadline&#x27; : deadline === &#x27;run&#x27; ? `RUN · ${time.value}` : deadline === &#x27;stage-start&#x27; ? `Before ${stage.value.replace(&#x27;Tier &#x27;, &#x27;T&#x27;)}` : `${stage.value.replace(&#x27;Tier &#x27;, &#x27;T&#x27;)} OT · ${time.value}`;
        row.innerHTML = `&lt;span class=&quot;bonk2-grip&quot;&gt;⠿&lt;/span&gt;&lt;div&gt;&lt;b&gt;${selected} &lt;i&gt;${kind === &#x27;item&#x27; ? &#x27;×&#x27; : &#x27;&#x27;}${required.value}&lt;/i&gt;&lt;/b&gt;&lt;small&gt;${priority.value}&lt;/small&gt;&lt;/div&gt;&lt;span class=&quot;bonk2-deadline&quot;&gt;${deadlineLabel}&lt;/span&gt;&lt;button type=&quot;button&quot;&gt;Edit&lt;/button&gt;`;
        document.getElementById(&#x27;bonk2-rule-list&#x27;).prepend(row);
      });

      renderPicks();
      updateDeadlineFields();
    })();
  &lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
